# Producción. Uso: ansible-playbook -i inventory-production.ini --vault-id production@~/.ansible-vault-pass-production site.yml
# acxess-prod es el alias de ~/.ssh/config: la IP no está en el repo.
# Primera ejecución: como root. Después: -e ansible_user=acxess-admin -K
[production]
acxess-prod ansible_user=root