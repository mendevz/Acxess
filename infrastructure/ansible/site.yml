---
- name: Configure new Acxess Server
  hosts: lab
  become: true
  vars:
    backup_user: acxess-backup
    deploy_user: acxess-deploy
    deploy_public_key: "{{ lookup('file', '~/.ssh/acxess_lab_deploy.pub') }}"
    rclone_version: "v1.76.0"
    rclone_zip_url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-linux-amd64.zip"
    rclone_sums_url: "https://downloads.rclone.org/{{ rclone_version }}/SHA256SUMS"
  
  tasks:
    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Autorize ssh key of deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        state: present
          
    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Allow SSH, HTTP y HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: reject all incoming traffic by default
      community.general.ufw:
        default: deny
        direction: incoming
    
    - name: Activate firewall
      community.general.ufw:
        state: enabled

    - name: Create apt keys directory 
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPC Key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Registry official Docker repository
      ansible.builtin.apt_repository:
        # amd64 fijo: la VM y el VPS son x86_64
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker y Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure that docker run with system
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Grant the deploy user access to Docker
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Create app web directory 
      ansible.builtin.file:
        path: /opt/acxess
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Install age and unzip
      ansible.builtin.apt:
        name:
          - age
          - unzip
        state: present

    - name: Download rclone
      ansible.builtin.get_url:
        url: "{{ rclone_zip_url }}"
        dest: "/usr/local/src/rclone-{{ rclone_version }}.zip"
        checksum: "sha256:{{ rclone_sums_url }}"
        mode: "0644"

    - name: Unpack rclone
      ansible.builtin.unarchive:
        src: "/usr/local/src/rclone-{{ rclone_version }}.zip"
        dest: /usr/local/src
        remote_src: true
        creates: "/usr/local/src/rclone-{{ rclone_version }}-linux-amd64/rclone"
    
    - name: Install rclone binary
      ansible.builtin.copy:
        src: "/usr/local/src/rclone-{{ rclone_version }}-linux-amd64/rclone"
        dest: /usr/local/bin/rclone
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Create backup user
      ansible.builtin.user:
        name: "{{ backup_user }}"
        shell: /usr/sbin/nologin
        create_home: true
        groups: docker
        append: true

    - name: Create backup tools directory
      ansible.builtin.file:
        path: /opt/acxess-backup
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backup-v2.sh"
        dest: /opt/acxess-backup/backup.sh
        owner: root
        group: root
        mode: "0755"
        
    - name: Create local backups directory
      ansible.builtin.file:
        path: /var/backups/acxess
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0750"

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded