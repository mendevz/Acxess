---
- name: Configure new Acxess Server
  hosts: all
  become: true
  vars:
    backup_user: acxess-backup
    deploy_user: acxess-deploy
    deploy_public_key: "{{ lookup('file', '~/.ssh/acxess_lab_deploy.pub') }}"
    rclone_version: "v1.76.0"
    rclone_zip_url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-linux-amd64.zip"
    rclone_sums_url: "https://downloads.rclone.org/{{ rclone_version }}/SHA256SUMS"
  
  tasks:

    - name: Set network MTU (lab only)
      ansible.builtin.template:
        src: netplan-mtu.yaml.j2
        dest: /etc/netplan/60-acxess-mtu.yaml
        owner: root
        group: root
        mode: "0600"
      when: network_mtu is defined
      notify: Apply netplan

    - name: Apply network changes now
      ansible.builtin.meta: flush_handlers

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Autorize ssh key of deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        state: present
    
    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        password: "{{ vault_admin_password_hash }}"
        update_password: always
      no_log: true

    - name: Authorize SSH key of admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', admin_public_key_file) }}"
          
    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Allow SSH, HTTP y HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: reject all incoming traffic by default
      community.general.ufw:
        default: deny
        direction: incoming
    
    - name: Activate firewall
      community.general.ufw:
        state: enabled

    - name: Create apt keys directory 
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPC Key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Registry official Docker repository
      ansible.builtin.apt_repository:
        # amd64 fijo: la VM y el VPS son x86_64
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker y Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure that docker run with system
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Grant the deploy user access to Docker
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Create app web directory 
      ansible.builtin.file:
        path: /opt/acxess
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Install app compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../src/docker-compose.prod.yml"
        dest: /opt/acxess/docker-compose.yml
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"

    - name: Install Caddyfile
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../{{ app_caddyfile | default('Caddyfile') }}"
        dest: /opt/acxess/Caddyfile
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"

    - name: Install compose override (lab only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ app_compose_override }}"
        dest: /opt/acxess/docker-compose.override.yml
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"
      when: app_compose_override is defined

    - name: Remove compose override outside the lab
      ansible.builtin.file:
        path: /opt/acxess/docker-compose.override.yml
        state: absent
      when: app_compose_override is not defined

    - name: Install app environment
      ansible.builtin.template:
        src: app.env.j2
        dest: /opt/acxess/.env
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      diff: false

    - name: Create Docker config directory for deploy user
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.docker"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Log in deploy user to GHCR
      ansible.builtin.template:
        src: docker-config.json.j2
        dest: "/home/{{ deploy_user }}/.docker/config.json"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      diff: false

    - name: Install age and unzip
      ansible.builtin.apt:
        name:
          - age
          - unzip
        state: present

    - name: Download rclone
      ansible.builtin.get_url:
        url: "{{ rclone_zip_url }}"
        dest: "/usr/local/src/rclone-{{ rclone_version }}.zip"
        checksum: "sha256:{{ rclone_sums_url }}"
        mode: "0644"

    - name: Unpack rclone
      ansible.builtin.unarchive:
        src: "/usr/local/src/rclone-{{ rclone_version }}.zip"
        dest: /usr/local/src
        remote_src: true
        creates: "/usr/local/src/rclone-{{ rclone_version }}-linux-amd64/rclone"
    
    - name: Install rclone binary
      ansible.builtin.copy:
        src: "/usr/local/src/rclone-{{ rclone_version }}-linux-amd64/rclone"
        dest: /usr/local/bin/rclone
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Create backup user
      ansible.builtin.user:
        name: "{{ backup_user }}"
        shell: /usr/sbin/nologin
        create_home: true
        groups: docker
        append: true

    - name: Create backup tools directory
      ansible.builtin.file:
        path: /opt/acxess-backup
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backup-v2.sh"
        dest: /opt/acxess-backup/backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install photos backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../photos-backup.sh"
        dest: /opt/acxess-backup/photos-backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Create local backups directory
      ansible.builtin.file:
        path: /var/backups/acxess
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0750"

    - name: Install backup configuration
      ansible.builtin.template:
        src: backup.env.j2
        dest: /opt/acxess-backup/.env
        owner: root
        group: "{{ backup_user }}"
        mode: "0640"
      no_log: true
      diff: false

    - name: Create rclone config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0700"
      loop:
        - "/home/{{ backup_user }}/.config"
        - "/home/{{ backup_user }}/.config/rclone"

    - name: Install rclone configuration
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "/home/{{ backup_user }}/.config/rclone/rclone.conf"
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0600"
      no_log: true
      diff: false

    - name: Install backup service
      ansible.builtin.template:
        src: acxess-backup.service.j2
        dest: /etc/systemd/system/acxess-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install backup timer
      ansible.builtin.template:
        src: acxess-backup.timer.j2
        dest: /etc/systemd/system/acxess-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install photos backup service
      ansible.builtin.template:
        src: acxess-photos-backup.service.j2
        dest: /etc/systemd/system/acxess-photos-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install photos backup timer
      ansible.builtin.template:
        src: acxess-photos-backup.timer.j2
        dest: /etc/systemd/system/acxess-photos-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install restore script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../restore.sh"
        dest: /usr/local/sbin/acxess-restore
        owner: root
        group: root
        mode: "0750"

    - name: Apply systemd changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable photos backup timer
      ansible.builtin.systemd:
        name: acxess-photos-backup.timer
        enabled: true
        state: started

    - name: Enable backup timer
      ansible.builtin.systemd:
        name: acxess-backup.timer
        enabled: true
        state: started

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply

    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
        
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true