services:
  # ==============================
  # Reverse Proxy (Auto HTTPS)
  # ==============================
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data # Guarda los certificados SSL
      - caddy_config:/config
    networks:
      - acxess-network
    depends_on:
      - acxess-web
    profiles: ["app"]
  # ==============================
  # DataBase SQL Server
  # ==============================
  acxess-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_acxess_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:1433:1433"
    mem_limit: 3072m
    cpus: 1.0
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express  
      - TZ=UTC 
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 3s
    volumes:
      - sql_data:/var/opt/mssql 
    networks:
      - acxess-network

  # ==============================
  # Distributed Cache
  # ==============================
  acxess-redis:
    image: redis:7-alpine
    container_name: redis_acxess
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - acxess-network
    profiles: ["tools", "app"]

  # ==============================
  #  Data base migrator 
  # ==============================
  acxess-migrator:
    image: ghcr.io/mendevz/acxess-web:${APP_VERSION:-latest} 
    container_name: acxess_migrator
    command: ["dotnet", "Acxess.Web.dll", "--migrate-only"]
    depends_on:
      acxess-db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Server=acxess-db;Database=AcxessDB;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
      - SystemUser__Password=${SYSTEM_USER_PASSWORD}
      - CloudflareR2__BucketName=${S3_BUCKET_NAME}
      - CloudflareR2__AccessKey=${S3_ACCESS_KEY}
      - CloudflareR2__SecretKey=${S3_SECRET_KEY}
      - CloudflareR2__ServiceURL=${S3_SERVICE_URL}
      - CloudflareR2__PublicDomain=${S3_PUBLIC_DOMAIN}
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__FromPhoneNumber=${TWILIO_FROM_PHONE_NUMBER}
    networks:
      - acxess-network
    profiles: ["tools", "app"]

  # ==============================
  #  App Web
  # ==============================
  acxess-web:
    image: ghcr.io/mendevz/acxess-web:${APP_VERSION:-latest}
    container_name: acxess_web
    mem_limit: 512m
    restart: "unless-stopped"
    depends_on:
      acxess-db:
        condition: service_healthy
      acxess-redis:
        condition: service_healthy
      acxess-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT} 
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=acxess-db;Database=AcxessDB;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=acxess-redis:6379,password=${REDIS_PASSWORD},abortConnect=False,connectTimeout=10000,syncTimeout=10000
      - SystemUser__Password=${SYSTEM_USER_PASSWORD}
      - RUN_MIGRATIONS=false
      - TZ=America/Mexico_City 
      - OpenTelemetry__Endpoint=${OPEN_TELEMETRY_ENDPOINT}
      - OpenTelemetry__Token=${OPEN_TELEMETRY_TOKEN}
      - CloudflareR2__BucketName=${S3_BUCKET_NAME}
      - CloudflareR2__AccessKey=${S3_ACCESS_KEY}
      - CloudflareR2__SecretKey=${S3_SECRET_KEY}
      - CloudflareR2__ServiceURL=${S3_SERVICE_URL}
      - CloudflareR2__PublicDomain=${S3_PUBLIC_DOMAIN}
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__FromPhoneNumber=${TWILIO_FROM_PHONE_NUMBER}
    networks:
      - acxess-network
    profiles: ["app"]

volumes:
  caddy_data:
  caddy_config:
  sql_data:
  redis_data:

networks:
  acxess-network:
    driver: bridge
