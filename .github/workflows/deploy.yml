name: CI/CD Pipeline - Acxess Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag to deploy (ej. v1.0.0).'
        required: true
        default: 'v1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/acxess-web
  APP_VERSION: ${{ github.event.inputs.version_tag || github.ref_name }}

jobs:
  # ==========================================
  # Contineus Integration
  # ==========================================
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download code source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_VERSION }}

      # -----------------------------------------------------------------
      # Quality Control (Tests )
      # -----------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install NPM dependencies (Tailwind)
        working-directory: ./src/Acxess.Web
        run: npm install

      - name: Execute Validation Suite (Stop-on-Failure)
        run: dotnet test src/Acxess.sln --configuration Release --verbosity minimal

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Acxess.Web/DOCKERFILE
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

  # ==========================================
  # FASE 2: Despliegue Continuo (CD)
  # ==========================================
  deploy:
    name: Deploy to VPS mendez-server
    needs: build-and-push 
    runs-on: ubuntu-latest
    
    steps:
      - name: Download code source
        uses: actions/checkout@v4

      - name: Copy Infrastructure Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MENDEZ_SERVER_IP }}
          username: acxess-deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/docker-compose.prod.yml,infrastructure/Caddyfile"
          target: "/opt/acxess/" 

      - name: Connect to VPS via SSH and Update Containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MENDEZ_SERVER_IP }}
          username: acxess-deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_VERSION
          script: |
            set -e
            cd /opt/acxess

            mv src/docker-compose.prod.yml docker-compose.yml
            mv infrastructure/Caddyfile .
            rm -rf src infrastructure

            # The deploy only changes the version on .env.
            test -f .env || { echo "ERROR: /opt/acxess/.env not found. Run ansible-playbook first."; exit 1; }
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${APP_VERSION}/" .env
            grep -qxF "APP_VERSION=${APP_VERSION}" .env || { echo "ERROR: APP_VERSION was not updated in .env"; exit 1; }

            # Download the new image, then run the migrator and start the app
            docker compose pull
            docker compose --profile app up -d --force-recreate --remove-orphans

            # Delete old untagged images
            docker image prune -f
